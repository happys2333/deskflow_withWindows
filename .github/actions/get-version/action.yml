name: "Get version"
description: "Gets the version number from GitHub environment"

runs:
  using: "composite"

  steps:
    - run: |
        DESKFLOW_VERSION=$(git describe --long --tags --match 'v*' 2>/dev/null | sed 's/-/./g;s/v//g' | grep -o '^[0-9]*.[0-9]*.[0-9]*.[0-9]*' || true)
        if [[ -z "$DESKFLOW_VERSION" ]]; then
          DESKFLOW_VERSION="0.0.0.$(git rev-list --count HEAD)"
        fi
        echo "DESKFLOW_VERSION=$DESKFLOW_VERSION">> $GITHUB_ENV
        if [[ "$GITHUB_REF" == *"tags/v"* ]]; then
          echo "DESKFLOW_PACKAGE_VERSION=$(echo $GITHUB_REF | sed 's,refs/tags/v,,g')">> $GITHUB_ENV
        else
          echo "DESKFLOW_PACKAGE_VERSION=continuous">> $GITHUB_ENV
        fi
      shell: bash
